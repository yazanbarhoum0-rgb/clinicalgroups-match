<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6fb">
    <title>Vitanova Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patua+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/clinicalgroups.css">
    <script src="/clinicalgroups.js" defer></script>
  </head>
  <body>
    <main class="directory-page">
      <header class="site-header"><a class="wordmark" href="#top">Vitanova Match</a></header>

      <section class="registration" id="top">
        <h1>Find your group</h1>
        <form class="registration-form" id="listing-form">
          <fieldset class="field type-field"><legend>Are you an individual or a group?</legend>
            <div class="type-switch">
              <label class="selected"><input type="radio" name="listing-type" value="individual" checked><svg class="switch-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg><span>Individual</span></label>
              <label><input type="radio" name="listing-type" value="group"><svg class="switch-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-1.2a5.5 5.5 0 0 1 11 0V20M16 5.5a3 3 0 0 1 0 5.8M17 14.2a4.5 4.5 0 0 1 3.5 4.4V20"/></svg><span>Group</span></label>
            </div>
          </fieldset>

          <fieldset class="field type-field"><legend><span id="gender-label">Gender</span> <small>Shown publicly</small></legend>
            <div class="type-switch">
              <label><input type="radio" name="listing-gender" value="male" required><svg class="switch-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="12" r="5"/><path d="m11.5 8.5 6-6M13 2h4.5v4.5"/></svg><span>Male</span></label>
              <label><input type="radio" name="listing-gender" value="female" required><svg class="switch-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="5"/><path d="M10 12v7M6.5 15.5h7"/></svg><span>Female</span></label>
            </div>
          </fieldset>

          <label class="field field-wide" id="individual-name-field"><span>Name <small>Optional</small></span>
            <input id="listing-name" name="name" maxlength="80" placeholder="Your name">
          </label>

          <label class="field field-wide" id="group-size-field" hidden><span>Number of group members <small>2–11</small></span>
            <input id="members-count" name="members_count" type="number" min="2" max="11" step="1" value="2">
          </label>

          <label class="field field-wide"><span>Contact method <small>Shown publicly</small></span>
            <input id="listing-contact" name="contact" required maxlength="150" placeholder="Telegram @ or WhatsApp">
          </label>

          <label class="field field-wide"><span>Notes <small>Optional</small></span>
            <textarea id="listing-notes" name="notes" maxlength="280" rows="2" placeholder="Anything else?"></textarea>
          </label>

          <div class="form-submit field-wide">
            <button id="post-button" type="submit">Post</button>
            <span id="form-message" role="status"></span>
          </div>
        </form>
      </section>

      <section class="directory" aria-label="Student listings">
        <div class="section-heading">
          <h2>Listings</h2>
          <span id="listing-count">Loading…</span>
        </div>
        <div class="filter-panel">
          <h3 class="filters-title">Filters</h3>
          <div class="filters" id="listing-filters">
          <label>Order
            <button class="latest-filter-button" type="button" id="listing-order" aria-pressed="false">Latest</button>
          </label>
          <label>Type
            <select id="type-filter">
              <option value="all">All</option>
              <option value="individual">Individuals</option>
              <option value="group">Groups</option>
            </select>
          </label>
          <label id="group-size-filter-field">Group size
            <select id="group-size-filter">
              <option value="all">Any</option>
              <option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option>
              <option value="6">6</option><option value="7">7</option>
              <option value="8">8</option><option value="9">9</option>
              <option value="10">10</option><option value="11">11</option>
            </select>
          </label>
          <label>Gender
            <select id="gender-filter">
              <option value="all">All</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </label>
          </div>
        </div>
        <p class="listing-status" id="listing-message" role="status" hidden></p>
        <p class="setup-message" id="load-error" role="alert" hidden></p>
        <p class="empty-state" id="empty-state" hidden>No listings found.</p>
        <div class="student-list" id="student-list"></div>
      </section>
    </main>

    <dialog class="delete-dialog success-dialog" id="post-success-dialog" aria-labelledby="post-success-title">
      <h2 id="post-success-title">Your listing has been posted</h2>
      <p>You can scroll and check for matches, or wait for someone to reach out.</p>
      <div class="dialog-actions"><button type="button" class="confirm-delete" id="close-post-success">Continue browsing</button></div>
    </dialog>

    <dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
      <h2 id="delete-dialog-title">Delete listing</h2>
      <p class="dialog-question">Did you find the group?</p>
      <div class="dialog-choices">
        <button type="button" data-found-answer="yes">Yes</button>
        <button type="button" data-found-answer="no">No</button>
      </div>
      <label class="delete-contact-field" id="delete-contact-field" hidden>
        <span>Re-enter this listing’s contact method to confirm</span>
        <input id="delete-contact" autocomplete="off" placeholder="Contact method">
      </label>
      <p class="delete-error" id="delete-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="cancel-delete" id="cancel-delete">Cancel</button>
        <button type="button" class="confirm-delete" id="confirm-delete" disabled>Delete listing</button>
      </div>
    </dialog>
  </body>
</html>
